<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <form action="" method="POST">
        <!-- Bagian Akun -->
        <fieldset style="width: 400px;">
            <legend>Akun</legend>

            <table> 
                <tr>
                    <td><label for="username">Username</label></td>
                    <td>:</td>
                    <td><input type="text" id="username" name="username"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password"></td>
                </tr>
                <tr>
                    <td><label for="konfirmasi_password">Konfirmasi Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="konfirmasi_password" name="konfirmasi_password"></td>
                </tr>
            </table>
        </fieldset>

        <br>

        <!-- Bagian Data -->
        <fieldset style="width: 400px;">
            <legend>Data</legend>

            <table>
                <tr>
                    <td><label for="nama">Nama</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama"></td>
                </tr>

                <tr>
                    <td><label>Jenis Kelamin</label></td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="pria" name="jk" value="Pria">
                        <label for="pria">Pria</label><br>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan">
                        <label for="perempuan">Perempuan</label>
                    </td>

                </tr>
                
                <tr>
                    <td><label>Informasi Yang Disukai</label></td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" id="olahraga" name="hobi[]" value="Olahraga">
                        <label for="olahraga">Olahraga</label><br>
                        <input type="checkbox" id="travelling" name="hobi[]" value="Travelling">
                        <label for="travelling">Travelling</label><br>
                    </td>
                </tr>
                <tr>
                    <td><label for="kesehatan">Kesehatan</label></td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" id="kesehatan" name="hobi[]" value="Kesehatan">
                        <label for="kesehatan">Kesehatan</label>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <!-- Tombol Action -->
        <button type="submit" class="btn-daftar">Daftar</button>
        <button type="reset" class="btn-reset">Reset</button>
    </form>

</body>
</html>
